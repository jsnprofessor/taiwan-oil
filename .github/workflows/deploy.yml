name: Update data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 19 * * 0" # every Monday 03:00 Taiwan time
  workflow_dispatch:

permissions:
  contents: write # commit refreshed data
  pages: write
  id-token: write
  issues: write # the 需要檢查的加油站 review issue

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run tests
        run: |
          python3 -I -m unittest discover -s tests -p "test_*.py"
          node --test tests/*.test.js

      # If the download or checks fail, the job stops here and the live site keeps its old data.
      - name: Download station data
        run: python3 -I scripts/update_stations.py

      # Never fails the job: problems go to the review issue instead.
      - name: Match new stations to Google Maps
        env:
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
        run: python3 -I scripts/match_places.py

      # Commits every run because the "updated" date changes. This also keeps the
      # repo active so GitHub doesn't turn off the schedule after 60 quiet days.
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/stations.json data/places.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update station data"
            git push
          fi

      - name: Update review issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I scripts/review_issue.py
          title="需要檢查的加油站"
          num=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          if [ -s .review/issue.md ]; then
            if [ -z "$num" ]; then
              gh issue create --title "$title" --body-file .review/issue.md
            elif [ "$(gh issue view "$num" --json body --jq .body)" != "$(cat .review/issue.md)" ]; then
              gh issue edit "$num" --body-file .review/issue.md
              gh issue comment "$num" --body "清單已更新。"
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "全部處理完畢。"
          fi

      - name: Insert Google Maps settings
        env:
          GOOGLE_MAPS_API_KEY: ${{ vars.GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAP_ID: ${{ vars.GOOGLE_MAP_ID }}
        run: |
          test -n "$GOOGLE_MAPS_API_KEY" || { echo "Set the GOOGLE_MAPS_API_KEY repository variable"; exit 1; }
          test -n "$GOOGLE_MAP_ID" || { echo "Set the GOOGLE_MAP_ID repository variable"; exit 1; }
          sed -i \
            -e "s|__GOOGLE_MAPS_API_KEY__|$GOOGLE_MAPS_API_KEY|" \
            -e "s|__GOOGLE_MAP_ID__|$GOOGLE_MAP_ID|" \
            site/index.html
          # New asset URLs on every deploy, so browsers don't reuse cached CSS/JS
          sed -i "s|__BUILD__|${GITHUB_SHA::8}|g" site/index.html site/app.js
          # Tell search engines when the page (and its weekly data) last changed
          sed -i "s|__LASTMOD__|$(TZ=Asia/Taipei date +%F)|" site/sitemap.xml

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
