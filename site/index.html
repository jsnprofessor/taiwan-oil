<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <meta name="description" content="查詢全台中油加油站的位置、營業時間、油品與服務，一鍵導航。">
  <title>中油加油站地圖</title>

</head>

    <symbol id="i-close" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>

  <main id="map" aria-label="加油站地圖"></main>

  <header class="top">
    <div class="searchbar">
      <svg class="brand" aria-hidden="true"><use href="#i-pump"/></svg>
      <input id="search" type="search" placeholder="搜尋中油加油站、縣市或地址" autocomplete="off" enterkeyhint="search" aria-label="搜尋加油站">
      <button id="search-clear" class="icon-btn" type="button" aria-label="清除搜尋" hidden><svg><use href="#i-close"/></svg></button>
    </div>
    <div class="controls">
      <div id="types" class="segmented" role="radiogroup" aria-label="加油站類別"></div>
      <button id="filter-open" class="filter-btn" type="button" aria-label="更多篩選">
        <svg><use href="#i-tune"/></svg>
        <span id="filter-badge" class="badge-count" hidden></span>
      </button>
    </div>
  </header>

  <div class="fabs">
    <button id="fit" class="fab" type="button" aria-label="顯示全台"><svg><use href="#i-fit"/></svg></button>
    <button id="locate" class="fab" type="button" aria-label="我的位置"><svg><use href="#i-locate"/></svg></button>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <button id="credit-open" class="credit" type="button">
    <svg aria-hidden="true"><use href="#i-info"/></svg>資料來源
  </button>

  <div id="scrim" class="scrim" hidden></div>

  <section id="station" class="sheet" aria-label="加油站資訊" aria-hidden="true">
    <div class="handle" aria-hidden="true"></div>
    <button class="icon-btn sheet-close" type="button" data-close aria-label="關閉"><svg><use href="#i-close"/></svg></button>
    <div id="station-body"></div>
  </section>

  <section id="filters" class="sheet" aria-label="篩選" aria-hidden="true">
    <div class="handle" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2>篩選</h2>
      <button class="icon-btn" type="button" data-close aria-label="關閉"><svg><use href="#i-close"/></svg></button>
    </div>
    <div id="filter-groups" class="filter-groups"></div>
    <div class="sheet-foot">
      <button id="filter-clear" class="btn btn-ghost" type="button">清除</button>
      <button id="filter-apply" class="btn btn-primary" type="button" data-close>顯示 0 站</button>
    </div>
  </section>

  <section id="about" class="sheet" aria-label="關於" aria-hidden="true">
    <div class="handle" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2>關於本站</h2>
      <button class="icon-btn" type="button" data-close aria-label="關閉"><svg><use href="#i-close"/></svg></button>
    </div>
    <div class="about-body">
      <p>資料來源：<a href="https://data.gov.tw/dataset/6065" target="_blank" rel="noopener">台灣中油公司加油站服務資訊</a>（政府資料開放平臺），依政府資料開放授權條款使用。</p>
      <p>資料更新日期：<span id="updated">—</span>。每週自動更新，實際營業狀況以現場為準。</p>
      <p class="muted">本站為非官方網站，與台灣中油公司無關。</p>
    </div>
  </section>

    window.MAP_ID = "__GOOGLE_MAP_ID__";

</html>
